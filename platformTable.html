<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Ondřej Kotas, KRtkovo.eu" />
    <meta name="description" content="TLD registrator | Official Moravian Djamahiriya national TLD registrator" />
    <meta name="keywords" content="moravia,djamahiriya,moravská,občanika,moravska,obcanika,registrator,domen,domain" />
    <meta name="robots" content="index, follow" />

    <title>PRAGOTRON</title>

    <link rel="preload" href="images/pragotron.svg" as="image" type="image/svg+xml" />
    <link href="style.css" rel="stylesheet" type="text/css" media="screen,projection" />
    <link href="favicon.ico" rel="icon" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script language="javascript" type="text/javascript" src="js/jquery.thooClock.js"></script>  
</head>

<body>
    <div id="skrin">
        <script src="src/demos/platformTablePreload.js"></script>
        <div id="cernyLem">
            <div class="night-lighting" aria-hidden="true">
                <span class="night-light night-light--top-left" data-light-id="top-left"></span>
                <span class="night-light night-light--top-center" data-light-id="top-center"></span>
                <span class="night-light night-light--top-right night-light--dim" data-light-id="top-right"></span>
                <span class="night-light night-light--bottom-left" data-light-id="bottom-left"></span>
                <span class="night-light night-light--bottom-right" data-light-id="bottom-right"></span>
            </div>
            <div class="ridge-outer"><div class="ridge-inner">
        <table id="tabule" aria-label="Odjezdová tabule">
            <tr>
                <td colspan="3" class="light">&nbsp;</td>
            </tr>
            <tr>
                <td class="displayCell destinationCell">
                    <div
                        class="flap-display"
                        data-board-slot="stationOne"
                        data-text="PRAHA"
                        aria-label="PRAHA"
                        role="img"
                    ></div>
                </td>
                <td class="displayCell trainCell">
                    <div
                        class="train-flap-display"
                        data-board-slot="train"
                        data-type="Eurocity"
                        data-src="images/EuroCity_Logo.svg"
                        aria-label="Eurocity"
                        role="img"
                    ></div>
                </td>
                <td rowspan="3" id="clockBlock">
                    <div id="pragotronAnalogClock"></div>
                    <div class="label">Presný čas</div>
                </td>
            </tr>
            <tr>
                <td class="displayCell destinationCell">
                    <div
                        class="flap-display"
                        data-board-slot="stationTwo"
                        data-text="BRATISLAVA"
                        aria-label="BRATISLAVA"
                        role="img"
                    ></div>
                </td>
                <td class="displayCell timeCell">
                    <div
                        class="departure-time-display"
                        data-board-slot="departureTime"
                        data-hours="16"
                        data-minutes="20"
                        aria-label="Odjezd 16.20"
                        role="img"
                    >
                        <div class="time-flap time-hour-flap"></div>
                        <span class="time-separator" aria-hidden="true">.</span>
                        <div class="time-minute-group">
                            <div class="time-flap time-minute-flap"></div>
                            <div class="time-flap time-minute-flap"></div>
                        </div>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="light textRight bottomLeft delayLabelCell">
                    <div class="delay-label-content">
                        <div
                            class="lens-display"
                            data-board-slot="lenses"
                            role="img"
                            aria-label="2 signalizační čočky"
                        ></div>
                        <span class="staticLabel">MEŠKANIE</span>
                    </div>
                </td>
                <td class="displayCell delayCell">
                    <div
                        class="delay-flap-display"
                        data-board-slot="delay"
                        data-delay="5"
                        aria-label="Meškanie 5 minút"
                        role="img"
                    ></div>
                </td>
            </tr>
        </table></div></div></div>
        <div class="logo textRight">
            <img src="images/pragotronNapis.svg" class="pragotronLogo" />
        </div>
    </div>

    <div id="manage">
        <form id="boardForm">
            <fieldset>
                <div class="">
                    <legend>Nastavení odjezdové tabule</legend>
                </div>
                <div class="board-form-grid">
                    <label class="board-form-field" for="stationOne">
                        Stanice 1
                        <input
                            id="stationOne"
                            name="stationOne"
                            type="text"
                            maxlength="14"
                            autocomplete="off"
                        />
                    </label>
                    <label class="board-form-field" for="stationTwo">
                        Stanice 2
                        <input
                            id="stationTwo"
                            name="stationTwo"
                            type="text"
                            maxlength="14"
                            autocomplete="off"
                        />
                    </label>
                    <label class="board-form-field" for="trainType">
                        Typ vlaku
                        <select id="trainType" name="trainType"></select>
                    </label>
                    <label class="board-form-field" for="departureTime">
                        Odjezd
                        <input
                            id="departureTime"
                            name="departureTime"
                            type="time"
                            step="60"
                        />
                    </label>
                    <label class="board-form-field" for="delayValue">
                        Zpoždění
                        <select id="delayValue" name="delayValue"></select>
                    </label>
                </div>
                <div class="board-form-actions">
                    <button type="submit">Odeslat na tabuli</button>
                    <button id="startButton" type="button">Start/Reset</button>
                    <button id="nightModeButton" type="button" aria-pressed="false">
                        🌙 Noční režim
                    </button>
                    <button id="resetAllSettings" type="button">
                        Resetovat všechna nastavení
                    </button>
                </div>
                <fieldset id="lensSettingsPanel" class="lens-settings">
                    <div><legend>Nastavení čoček</legend></div>
                    <div id="lensControls"></div>
                </fieldset>
                <fieldset id="lampSettingsPanel" class="lamp-settings" hidden>
                    <div><legend>Nastavení jednotlivých žárovek</legend></div>
                    <div id="lampControls" class="lamp-controls">
                        <fieldset id="clockLightControl" class="lamp-control clock-light-control">
                            <div><legend>Osvětlení hodin</legend></div>
                            <div class="clock-light-controls">
                                <label class="lamp-control-check" for="clockLightEnabled">
                                    <input id="clockLightEnabled" type="checkbox" checked />
                                    Svítí
                                </label>
                                <label class="lamp-control-range" for="clockLightIntensity">
                                    <span class="lamp-control-range-header">
                                        <span>Intenzita</span>
                                <output id="clockLightIntensityOutput">50%</output>
                                    </span>
                                    <input
                                        id="clockLightIntensity"
                                        type="range"
                                        min="0"
                                        max="100"
                                        step="1"
                                value="50"
                                    />
                                </label>
                            </div>
                        </fieldset>
                    </div>
                    <p class="lamp-settings-help">
                        Checkbox „Kolísá“ zapíná vybraný světelný efekt. Volba
                        „Bez pohasínání“ udrží žárovku ve stálém svitu. Délka
                        cyklu je skutečný čas celého efektu; vyšší hodnota
                        znamená pomalejší změny.
                    </p>
                    <div class="lamp-settings-actions">
                        <button id="resetLampSettings" type="button">
                            Obnovit výchozí světla
                        </button>
                    </div>
                </fieldset>
                <p id="boardFormStatus" role="status" aria-live="polite"></p>
            </fieldset>
        </form>
    </div>

    <script src="src/demos/platformTableLoader.js"></script>
</body>
</html>
