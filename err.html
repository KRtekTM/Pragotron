<!doctype html>
<html lang="cs" class="manage-session-denied">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chyba serveru Pragotron">
    <title>Něco se pokazilo :( – PRAGOTRON</title>
    <link href="style.css" rel="stylesheet" type="text/css" media="screen,projection">
    <link href="images/tabule/pragotron.svg" rel="icon" type="image/svg+xml">
</head>
<body class="manage-night-mode">
    <p class="manage-session-pending-note">Chyba serveru</p>
    <section class="manage-session-screen" aria-labelledby="manageSessionTitle">
        <div class="manage-session-card">
            <img src="images/misc/manage-sad-engine.png" alt="Smutná mašinka stojí v noci před depem." width="720" height="512">
            <div class="manage-session-copy">
                <h1 id="manageSessionTitle">Něco se pokazilo :(</h1>
                <p id="errorMessage">Vyskytla se nějaká chyba, i to se bohužel občas stává.</p>
                <div id="manageSessionGuide" class="manage-session-guide"></div>
            </div>
        </div>
    </section>
    <script type="module">
        import { mountManageSessionDenied } from './src/demos/manageSessionDenied.js';

        const error = window.__PRAGOTRON_ERROR__;
        const message = document.querySelector('#errorMessage');
        if (message && error) {
            message.textContent = `Chyba ${error.code}: ${error.message}`;
        }
        mountManageSessionDenied(document);
    </script>
</body>
</html>
